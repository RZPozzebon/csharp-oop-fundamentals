<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F7F8"/>
      <stop offset="1" stop-color="#FFF3E6"/>
    </linearGradient>
    <!-- pata -->
    <g id="paw">
      <path d="M0 4c-14 0-25 12-25 22 0 8 7 12 14 12 5 0 8-2 11-2s6 2 11 2c7 0 14-4 14-12 0-10-11-22-25-22z"/>
      <ellipse cx="-27" cy="-6" rx="7" ry="10" transform="rotate(-25 -27 -6)"/>
      <ellipse cx="-11" cy="-22" rx="7" ry="10" transform="rotate(-8 -11 -22)"/>
      <ellipse cx="11" cy="-22" rx="7" ry="10" transform="rotate(8 11 -22)"/>
      <ellipse cx="27" cy="-6" rx="7" ry="10" transform="rotate(25 27 -6)"/>
    </g>
    <!-- osso -->
    <g id="bone">
      <rect x="-30" y="-6" width="60" height="12" rx="6"/>
      <circle cx="-30" cy="-8" r="8"/><circle cx="-30" cy="8" r="8"/>
      <circle cx="30" cy="-8" r="8"/><circle cx="30" cy="8" r="8"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- bolhas -->
  <g fill="none" stroke="#14B8C4" stroke-width="3" opacity=".22">
    <circle cx="200" cy="900" r="46"/><circle cx="270" cy="820" r="24"/><circle cx="150" cy="780" r="14"/>
    <circle cx="1720" cy="200" r="52"/><circle cx="1650" cy="290" r="26"/><circle cx="1790" cy="310" r="14"/>
    <circle cx="1500" cy="940" r="36"/><circle cx="420" cy="140" r="30"/>
  </g>

  <!-- patas -->
  <g fill="#14B8C4" opacity=".12">
    <use href="#paw" transform="translate(180 160) rotate(-20) scale(1.6)"/>
    <use href="#paw" transform="translate(620 300) rotate(15) scale(1.1)"/>
    <use href="#paw" transform="translate(1000 120) rotate(-10) scale(1.3)"/>
    <use href="#paw" transform="translate(1400 420) rotate(25) scale(1.8)"/>
    <use href="#paw" transform="translate(820 760) rotate(-25) scale(1.5)"/>
    <use href="#paw" transform="translate(1780 760) rotate(10) scale(1.2)"/>
    <use href="#paw" transform="translate(460 960) rotate(20) scale(1.0)"/>
  </g>

  <!-- ossos -->
  <g fill="#F6A04D" opacity=".16">
    <use href="#bone" transform="translate(420 520) rotate(-30) scale(1.5)"/>
    <use href="#bone" transform="translate(1180 620) rotate(20) scale(1.3)"/>
    <use href="#bone" transform="translate(1560 130) rotate(-15) scale(1.1)"/>
    <use href="#bone" transform="translate(100 450) rotate(35) scale(1.0)"/>
    <use href="#bone" transform="translate(1000 980) rotate(-20) scale(1.4)"/>
  </g>
</svg>
